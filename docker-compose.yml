# docker-compose.yml — Dark Sentinel v2, whole stack.
#
# Compose interpolates ${...} from a .env file in this directory, so step one is:
#   cp .env.example .env
#
#   docker compose up -d --build
#   docker compose run --rm seed
#
# then: API on http://localhost:8000/docs, console on http://localhost:3000
#
# `run --rm` rather than `up seed`: a one-shot service started with `up` leaves
# its exited container behind, and `down -v` does not remove it because it sits
# behind a profile — so the next `up seed` silently reuses the old container
# and seeds nothing. `run --rm` always starts fresh and cleans up after itself.
#
# Tearing down: `docker compose --profile seed down -v`. Without the profile
# flag the seed container survives the teardown.
#
# Autonomous mode is NOT a service here on purpose. It re-scans on a timer, and
# a stack that starts crawling because somebody ran `up` is not one anybody
# should run. Start it deliberately:
#   docker compose exec api python scripts/scheduler.py --start --interval 15m

services:
  db:
    image: postgres:16
    container_name: darksentinel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-darksentinel}
      POSTGRES_DB: ${PG_DB:-darksentinel}
      # Deterministic posting-hour histograms depend on the server not shifting
      # timestamps; everything we store is UTC (see schema_v2.sql header).
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DB:-darksentinel}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  tor:
    image: dperson/torproxy
    container_name: darksentinel-tor
    restart: unless-stopped
    ports:
      - "9050:9050"
    healthcheck:
      # Bootstrapping a circuit takes a while on a cold start, hence the long
      # start_period. Nothing depends on tor being *healthy* — the fixtures
      # path never touches it — so a slow or blocked Tor does not hold up the
      # demo, it only means `--source live` will refuse until it settles.
      test: ["CMD-SHELL", "curl -s --socks5-hostname localhost:9050 https://check.torproject.org/api/ip | grep -q '\"IsTor\":true'"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s

  api:
    build: .
    container_name: darksentinel-api
    restart: unless-stopped
    environment:
      PG_HOST: db
      PG_PORT: 5432
      PG_DB: ${PG_DB:-darksentinel}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-darksentinel}
      # Overrides the PG_* pair above if it leaks in from .env pointing at the
      # host; inside the network the database is `db`, never localhost.
      PG_URL: postgresql://${PG_USER:-postgres}:${PG_PASSWORD:-darksentinel}@db:5432/${PG_DB:-darksentinel}
      TOR_SOCKS: socks5h://tor:9050
      # Control port of the lab's tor daemon, for recon/descriptor.py's
      # `--source live`. Only reachable when the lab profile is up; with the
      # lab down, `--source fixtures` is the path and needs none of this.
      TOR_CONTROL_HOST: ${TOR_CONTROL_HOST:-lab-tor}
      TOR_CONTROL_PORT: ${TOR_CONTROL_PORT:-9051}
      TOR_CONTROL_PASSWORD: ${TOR_CONTROL_PASSWORD:-darksentinel-lab-control}
      OPERATOR_ID: ${OPERATOR_ID:-unknown}
      # Signs the session tokens. The default is a demo value and says so;
      # changing it signs everyone out, which is the intended behaviour.
      JWT_SECRET: ${JWT_SECRET:-change-me-this-is-a-demo-secret-not-a-real-one}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      # The browser talks to the console, which proxies; this is the console's
      # origin, which is what CORS has to allow.
      API_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      tor:
        condition: service_started

  ui:
    build: ./ui
    container_name: darksentinel-ui
    restart: unless-stopped
    environment:
      # Read at runtime by app/api/_backend.ts. The browser never calls the API
      # directly — every attribution page goes through the console's own route
      # handlers — so the service name is the right address here.
      BACKEND_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # ── the practice target ────────────────────────────────────────────────────
  #
  #   docker compose --profile lab up -d --build
  #   docker compose exec lab-tor cat /var/lib/tor/lab_hs/hostname
  #   python scripts/collect.py --onion http://<that>.onion --out collected.json
  #
  # Behind a profile: a plain `docker compose up` should not stand up a fake
  # marketplace. It serves the synthetic fixture corpus and says so in its own
  # HTML, and it exists so the collectors have something real to crawl —
  # "collects over Tor" is otherwise a claim nobody in this repo has tested.
  #
  # Reaching it needs the real Tor network (a v3 service is published to the
  # distributed hash table, so there is no offline shortcut). That is why it is
  # a profile and not part of the demo path: `--source fixtures` still runs
  # with the network unplugged.
  lab:
    build:
      context: .
      dockerfile: lab/Dockerfile
    container_name: darksentinel-lab
    profiles: ["lab"]
    restart: unless-stopped
    # No ports: by default. The lab is reached through its onion address, which
    # is the point of it. Add `- "8099:8080"` locally to crawl it over plain
    # HTTP while developing a parser.
    expose:
      - "8080"
      - "8443"

  lab-tor:
    build:
      context: .
      dockerfile: lab/Dockerfile.tor
    container_name: darksentinel-lab-tor
    profiles: ["lab"]
    restart: unless-stopped
    # 9051 is the control port (see lab/torrc). Deliberately `expose` and not
    # `ports`: the api container needs to reach it, the host does not, and a
    # control port published on 0.0.0.0 hands that daemon to anyone who can
    # reach the machine.
    expose:
      - "9051"
    volumes:
      # Keeps the onion address (and its private key) across restarts, so the
      # address written into notes before a demo is still the address on the
      # day. `docker volume rm dark-sentinel-v2_lab_hs` rolls a new one.
      - lab_hs:/var/lib/tor
    depends_on:
      - lab

  # ── one-shot: apply the schema and load the demo corpus ────────────────────
  #
  #   docker compose run --rm seed
  #
  # Behind a profile so `docker compose up` never rewrites a populated database
  # as a side effect of starting the stack. Run it with `run --rm`, not
  # `up seed` — see the header.
  seed:
    build: .
    # Deliberately no container_name: `run --rm` names its own container, and a
    # fixed name collides with any leftover from a previous run.
    profiles: ["seed"]
    environment:
      PG_URL: postgresql://${PG_USER:-postgres}:${PG_PASSWORD:-darksentinel}@db:5432/${PG_DB:-darksentinel}
      OPERATOR_ID: ${OPERATOR_ID:-seed}
      DEMO_ANALYST_PASSWORD: ${DEMO_ANALYST_PASSWORD:-analyst-demo}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-admin-demo}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python scripts/apply_schema.py &&
             python scripts/load_fixtures.py --reset &&
             python scripts/ingest.py --source fixtures &&
             python scripts/load_feedback.py --source fixtures &&
             python -m link.resolve --source db &&
             python -m link.cluster  --source db &&
             python -m recon.fingerprint --source fixtures &&
             python -m recon.correlate  --source db &&
             python scripts/seed_users.py &&
             python scripts/evaluate.py --source db"

volumes:
  pgdata:
  lab_hs:
